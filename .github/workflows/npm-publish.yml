name: Node.js Package

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install pnpm
        run: npm install -g pnpm@latest
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      
      - name: Install dependencies (first pass to detect builds)
        run: pnpm install --no-frozen-lockfile || true
        env:
          CI: false
      
      - name: List and approve builds
        run: |
          pnpm approve-builds --list || true
          echo "y" | pnpm approve-builds canvas esbuild core-js 2>/dev/null || true
      
      - name: Reinstall with approved builds
        run: pnpm install --no-frozen-lockfile
        env:
          CI: false
      
      - name: Build
        run: pnpm run build
      
      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}