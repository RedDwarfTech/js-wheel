name: Node.js Package

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install system dependencies for canvas
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          CI: false
      # 关键步骤：批准需要构建脚本的依赖包
      - name: Approve builds
        run: pnpm approve-builds canvas core-js esbuild

      - name: Build
        run: pnpm run build
      
      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}